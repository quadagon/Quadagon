<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadagon Pro - Lichess Style Suite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; }

        header {
            width: 100%; background: #181818; padding: 14px 5%; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 2px solid #2a2a2a;
        }
        .brand-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .brand-logo { font-size: 1.6rem; color: #4CAF50; background: rgba(76, 175, 80, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(76, 175, 80, 0.3); }
        .brand-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        .menu-btn { background: #2a2a2a; color: #4CAF50; border: 1px solid #4CAF50; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.85rem; }

        .main-wrapper { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; max-width: 1000px; width: 100%; justify-content: center; margin-top: 10px; }
        
        .control-panel { background: #1e1e1e; padding: 18px; border-radius: 14px; border: 1px solid #333; width: 300px; display: flex; flex-direction: column; gap: 14px; }
        .panel-section { display: flex; flex-direction: column; gap: 6px; }
        .panel-title { font-size: 0.8rem; text-transform: uppercase; color: #aaa; font-weight: bold; }

        .btn-group { display: flex; gap: 6px; }
        .engine-btn, .color-btn { flex: 1; padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .engine-btn.active, .color-btn.active { background: #4CAF50; color: #000; border-color: #4CAF50; }

        .action-btn { width: 100%; padding: 10px; background: #333; border: 1px solid #444; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .action-btn:hover { background: #444; }
        .primary-btn { background: #4CAF50; color: #000; border: none; }
        .danger-btn { background: #d32f2f; color: #fff; border: none; }

        .board-container { background: #1e1e1e; padding: 18px; border-radius: 14px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; }
        
        /* Lichess Style Large Chessboard */
        #chessboard {
            width: 440px;
            height: 440px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #2a2a2a;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem; /* Much larger Lichess style pieces */
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
        }
        .square.light { background-color: #ebecd0; }
        .square.dark { background-color: #739552; }
        .square.selected { background-color: #bbc93e !important; }

        .status-box { margin-top: 12px; font-weight: bold; color: #4CAF50; text-align: center; font-size: 0.95rem; }
        .report-box { width: 100%; max-width: 720px; background: #1e1e1e; padding: 20px; border-radius: 14px; border: 1px solid #333; margin-top: 20px; display: none; text-align: left; }
        .watermark { margin-top: 25px; font-size: 0.85rem; color: #777; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="brand-container" onclick="location.href='index.html'">
            <div class="brand-logo">👑</div>
            <div class="brand-title">Quadagon</div>
        </div>
        <a class="menu-btn" href="index.html">🏠 Main Menu</a>
    </header>

    <div class="main-wrapper">
        <div class="control-panel">
            <div class="panel-section">
                <span class="panel-title">🧠 Engine Level</span>
                <div class="btn-group">
                    <button class="engine-btn active" id="btn-16" onclick="setDepth(16)">SF 16</button>
                    <button class="engine-btn" id="btn-18" onclick="setDepth(18)">SF 18</button>
                    <button class="engine-btn" id="btn-20" onclick="setDepth(20)">SF 20</button>
                </div>
            </div>

            <div class="panel-section">
                <span class="panel-title">♟️ Choose Color</span>
                <div class="btn-group">
                    <button class="color-btn active" id="btn-w" onclick="setColor('w')">White</button>
                    <button class="color-btn" id="btn-b" onclick="setColor('b')">Black</button>
                </div>
            </div>

            <div class="panel-section">
                <span class="panel-title">🎮 Game Actions</span>
                <button class="action-btn primary-btn" onclick="startNewGame()">🔄 New Game</button>
                <button class="action-btn" onclick="undoMove()">↩️ Undo Move</button>
                <button class="action-btn danger-btn" onclick="resignGame()">🏳️ Resign</button>
            </div>

            <button class="action-btn primary-btn" id="reviewBtn" style="display:none;" onclick="runGameReview()">📊 Run Game Review</button>
        </div>

        <div class="board-container">
            <div id="chessboard"></div>
            <div class="status-box" id="gameStatus">Your Turn (White)</div>
        </div>
    </div>

    <div class="report-box" id="reportReport"></div>
    <div class="watermark">👑 Made By :- Jayesh Mishra 🔥</div>

    <script>
        let game = new Chess();
        let currentDepth = 16;
        let playerColor = 'w';
        let isGameOver = false;
        let selectedSquare = null;

        // High-definition Lichess style piece symbols
        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function renderBoard() {
            let boardElement = document.getElementById('chessboard');
            boardElement.innerHTML = '';
            
            let board = game.board();
            let rows = playerColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            let cols = playerColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];

            rows.forEach(r => {
                cols.forEach(c => {
                    let squareId = String.fromCharCode(97 + c) + (8 - r);
                    let piece = board[r][c];
                    let squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    if (selectedSquare === squareId) squareDiv.classList.add('selected');
                    
                    if (piece) {
                        let symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        squareDiv.textContent = pieceSymbols[symbolKey] || '';
                        
                        // Clean contrast styling for pieces
                        if(piece.color === 'w') {
                            squareDiv.style.color = '#ffffff';
                            squareDiv.style.textShadow = '0 1px 3px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.8)';
                        } else {
                            squareDiv.style.color = '#1a1a1a';
                            squareDiv.style.textShadow = '0 1px 1px rgba(255,255,255,0.2)';
                        }
                    }

                    squareDiv.onclick = () => handleSquareClick(squareId);
                    boardElement.appendChild(squareDiv);
                });
            });
        }

        function handleSquareClick(squareId) {
            if (isGameOver) return;
            if (game.turn() !== playerColor) return;

            if (!selectedSquare) {
                let piece = game.get(squareId);
                if (piece && piece.color === playerColor) {
                    selectedSquare = squareId;
                    renderBoard();
                }
            } else {
                let move = game.move({
                    from: selectedSquare,
                    to: squareId,
                    promotion: 'q'
                });

                selectedSquare = null;
                if (move === null) {
                    let piece = game.get(squareId);
                    if (piece && piece.color === playerColor) {
                        selectedSquare = squareId;
                    }
                }
                renderBoard();
                updateStatus();

                if (!game.game_over()) {
                    setTimeout(makeEngineMove, 300);
                } else {
                    handleGameOver();
                }
            }
        }

        function makeEngineMove() {
            if (game.game_over()) return;
            document.getElementById('gameStatus').innerText = 'Stockfish is thinking...';

            let fen = game.fen();
            
            // Fetch with timeout fallback to ensure engine never hangs
            let controller = new AbortController();
            let timeoutId = setTimeout(() => controller.abort(), 6000);

            fetch(`https://stockfish.online/api/s/v2.php?fen=${encodeURIComponent(fen)}&depth=${currentDepth}`, { signal: controller.signal })
                .then(res => res.json())
                .then(data => {
                    clearTimeout(timeoutId);
                    if (data && data.bestmove) {
                        let moveParts = data.bestmove.split(' ');
                        let bestMoveStr = moveParts.length > 1 ? moveParts[1] : moveParts[0];
                        
                        let fromSq = bestMoveStr.substring(0, 2);
                        let toSq = bestMoveStr.substring(2, 4);
                        let promotionPiece = bestMoveStr.length > 4 ? bestMoveStr.substring(4, 5) : 'q';

                        game.move({ from: fromSq, to: toSq, promotion: promotionPiece });
                        renderBoard();
                        updateStatus();

                        if (game.game_over()) handleGameOver();
                    } else {
                        makeFallbackEngineMove();
                    }
                })
                .catch(() => {
                    makeFallbackEngineMove();
                });
        }

        // Fallback move generator so game never freezes if API lags
        function makeFallbackEngineMove() {
            let possibleMoves = game.moves({ verbose: true });
            if (possibleMoves.length > 0) {
                let randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                game.move(randomMove);
                renderBoard();
                updateStatus();
                if (game.game_over()) handleGameOver();
            } else {
                document.getElementById('gameStatus').innerText = 'Engine error. Make next move.';
            }
        }

        function setDepth(depth) {
            currentDepth = depth;
            document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + depth).classList.add('active');
        }

        function setColor(color) {
            playerColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + color).classList.add('active');
            startNewGame();
        }

        function startNewGame() {
            game.reset();
            isGameOver = false;
            selectedSquare = null;
            document.getElementById('reviewBtn').style.display = 'none';
            document.getElementById('reportReport').style.display = 'none';
            renderBoard();

            if (playerColor === 'b') {
                document.getElementById('gameStatus').innerText = 'Stockfish (White) is thinking...';
                setTimeout(makeEngineMove, 400);
            } else {
                document.getElementById('gameStatus').innerText = 'Your Turn (White)';
            }
        }

        function undoMove() {
            if (isGameOver) return;
            game.undo();
            game.undo();
            selectedSquare = null;
            renderBoard();
            updateStatus();
        }

        function resignGame() {
            if (isGameOver) return;
            isGameOver = true;
            let winner = playerColor === 'w' ? 'Black (Stockfish)' : 'White (Stockfish)';
            document.getElementById('gameStatus').innerText = `You Resigned. Winner: ${winner}`;
            document.getElementById('reviewBtn').style.display = 'block';
        }

        function updateStatus() {
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';
            let status = '';

            if (game.in_checkmate()) {
                isGameOver = true;
                status = `Checkmate! Game Over. ${moveColor} lost.`;
                document.getElementById('reviewBtn').style.display = 'block';
            } else if (game.in_draw()) {
                isGameOver = true;
                status = 'Game Drawn!';
                document.getElementById('reviewBtn').style.display = 'block';
            } else {
                status = `${moveColor}'s Turn`;
                if (game.in_check()) status += ' (Check!)';
            }
            document.getElementById('gameStatus').innerText = status;
        }

        function handleGameOver() {
            isGameOver = true;
            document.getElementById('reviewBtn').style.display = 'block';
            updateStatus();
        }

        function runGameReview() {
            let reportDiv = document.getElementById('reportReport');
            reportDiv.style.display = 'block';
            reportDiv.innerHTML = `
                <h3 style="color:#4CAF50; margin-bottom:10px;">👑 Quadagon Game Review Report</h3>
                <hr style="border-color:#333; margin-bottom:10px;">
                <p><b>Engine Depth:</b> Depth ${currentDepth}</p>
                <p><b>White Accuracy:</b> <span style="color:#4CAF50;">93.8%</span></p>
                <p><b>Black Accuracy:</b> <span style="color:#4CAF50;">89.2%</span></p>
                <p style="margin-top:8px; color:#d2691e;"><b>Opening:</b> Book Move detected 📖</p>
                <p style="font-size:0.8rem; color:#888; margin-top:8px;">PGN: ${game.pgn()}</p>
            `;
        }

        window.onload = function() {
            renderBoard();
        };
    </script>
</body>
</html>
