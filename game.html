<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quadagon Pro - Strong Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <style>
        body { background: #121212; color: #fff; text-align: center; font-family: sans-serif; }
        #chessboard { width: 400px; height: 400px; margin: 20px auto; }
    </style>
</head>
<body>
    <h2>Quadagon Strong Engine</h2>
    <div id="chessboard"></div>
    <script>
        var game = new Chess();
        var board = Chessboard('chessboard', {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDrop: onDrop
        });

        function onDrop(s, t) {
            var move = game.move({from: s, to: t, promotion: 'q'});
            if (!move) return 'snapback';
            board.position(game.fen());
            
            // Stockfish API hit (Stronger)
            fetch(`https://stockfish.online/api/s/v2.php?fen=${game.fen()}&depth=15`)
                .then(res => res.json())
                .then(data => {
                    game.move(data.bestmove.split(' ')[1]);
                    board.position(game.fen());
                });
        }
    </script>
</body>
</html>
