<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadagon - Play vs Stockfish</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

        header {
            width: 100%; background: #181818; padding: 12px 4%; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 2px solid #2a2a2a;
        }
        .brand-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .brand-logo { font-size: 1.6rem; color: #4CAF50; background: rgba(76, 175, 80, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(76, 175, 80, 0.3); }
        .brand-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; }

        .lobby-home-btn {
            background: #2a2a2a; color: #4CAF50; border: 1px solid #4CAF50; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.85rem;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px;
        }
        .lobby-home-btn:hover { background: #4CAF50; color: #000; }

        .main-container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; width: 100%; justify-content: center; align-items: flex-start; }

        .board-card { background: #1e1e1e; padding: 18px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .board-wrapper { width: 440px; height: 440px; position: relative; }
        #chessboard { width: 100%; height: 100%; }

        .board-controls { display: flex; gap: 10px; width: 100%; }
        .action-btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; border: none; transition: 0.2s; }
        .undo-btn { background: #333; color: #ccc; border: 1px solid #444; }
        .undo-btn:hover { background: #444; color: #fff; }
        .newgame-btn { background: #4CAF50; color: #000; }
        .newgame-btn:hover { background: #45a049; }
        .flip-btn { background: #2a2a2a; color: #4CAF50; border: 1px solid #4CAF50; }
        .flip-btn:hover { background: #4CAF50; color: #000; }

        .sidebar { flex: 1; min-width: 320px; max-width: 420px; background: #1e1e1e; padding: 20px; border-radius: 16px; border: 1px solid #333; display: flex; flex-direction: column; gap: 16px; }

        .setting-box { background: #141414; padding: 14px; border-radius: 10px; border: 1px solid #2a2a2a; }
        .setting-label { font-size: 0.85rem; color: #aaa; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
        
        select { width: 100%; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 0.95rem; outline: none; }
        select:focus { border-color: #4CAF50; }

        .status-box { background: #141414; padding: 14px; border-radius: 10px; border: 1px solid #2a2a2a; text-align: center; }
        .status-title { font-size: 1rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .status-eval { font-size: 0.85rem; color: #4CAF50; font-weight: bold; }

        .moves-box { background: #141414; padding: 14px; border-radius: 10px; border: 1px solid #333; flex: 1; min-height: 150px; display: flex; flex-direction: column; }
        .moves-title { font-size: 0.85rem; font-weight: bold; color: #4CAF50; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .moves-list { font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; color: #e0e0e0; line-height: 1.6; overflow-y: auto; max-height: 160px; word-break: break-word; }

        footer { margin-top: auto; padding: 15px; text-align: center; color: #666; font-size: 0.8rem; border-top: 1px solid #222; width: 100%; }

        @media (max-width: 500px) {
            .board-wrapper { width: 100%; height: 320px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-container" onclick="goToLobby()">
            <div class="brand-logo">◈</div>
            <div class="brand-title">Quadagon</div>
        </div>
        <button class="lobby-home-btn" onclick="goToLobby()">🏠 Main Menu</button>
    </header>

    <div class="main-container">
        <div class="board-card">
            <div class="board-wrapper">
                <div id="chessboard"></div>
            </div>
            <div class="board-controls">
                <button class="action-btn undo-btn" onclick="undoMove()">↩️ Undo</button>
                <button class="action-btn flip-btn" onclick="flipBoard()">🔄 Flip</button>
                <button class="action-btn newgame-btn" onclick="resetGame()">🎮 New Game</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="setting-box">
                <label class="setting-label">🤖 Select Stockfish Engine Level</label>
                <select id="engineLevel" onchange="changeDifficulty()">
                    <option value="1">Level 1: Beginner (Friendly ~1000 ELO)</option>
                    <option value="5" selected>Level 2: Intermediate (Club ~1600 ELO)</option>
                    <option value="12">Level 3: Master (Stockfish GM ~2400+ ELO)</option>
                </select>
            </div>

            <div class="setting-box">
                <label class="setting-label">♟️ Play As Color</label>
                <select id="playerColor" onchange="changeColor()">
                    <option value="w" selected>White (First Move)</option>
                    <option value="b">Black (Second Move)</option>
                </select>
            </div>

            <div class="status-box">
                <div class="status-title" id="gameStatus">Your Turn</div>
                <div class="status-eval" id="engineStatus">Stockfish Ready</div>
            </div>

            <div class="moves-box">
                <div class="moves-title">📜 Notation Log</div>
                <div class="moves-list" id="movesList">1. ...</div>
            </div>
        </div>
    </div>

    <footer>
        Quadagon Chess Suite &copy; 2026 | Powered by Stockfish API & Chessboard.js
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let playerColor = 'w';
        let engineDepth = 5;
        let isEngineThinking = false;

        function goToLobby() {
            window.location.href = 'index.html';
        }

        $(document).ready(function() {
            board = Chessboard('chessboard', {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            updateStatus();
        });

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over() || isEngineThinking) return false;
            if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
                (playerColor === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
            if (!game.game_over()) {
                setTimeout(makeEngineMove, 300);
            }
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function makeEngineMove() {
            if (game.game_over()) return;

            isEngineThinking = true;
            $('#engineStatus').text('Stockfish is thinking...');

            const fen = encodeURIComponent(game.fen());
            const url = `https://stockfish.online/api/s/v2.php?fen=${fen}&depth=${engineDepth}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    isEngineThinking = false;
                    if (data && data.success && data.bestmove) {
                        const bestMoveStr = data.bestmove.split(' ')[1];
                        if (bestMoveStr) {
                            const fromSquare = bestMoveStr.substring(0, 2);
                            const toSquare = bestMoveStr.substring(2, 4);
                            const promotion = bestMoveStr.length > 4 ? bestMoveStr.substring(4, 5) : 'q';

                            game.move({
                                from: fromSquare,
                                to: toSquare,
                                promotion: promotion
                            });

                            board.position(game.fen());
                            updateStatus();
                            $('#engineStatus').text(`Stockfish Depth ${engineDepth}`);
                        }
                    } else {
                        makeFallbackMove();
                    }
                })
                .catch(err => {
                    isEngineThinking = false;
                    makeFallbackMove();
                });
        }

        function makeFallbackMove() {
            const possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;
            const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            game.move(randomMove);
            board.position(game.fen());
            updateStatus();
            $('#engineStatus').text('Stockfish Ready (Fallback)');
        }

        function updateStatus() {
            let statusStr = '';
            let moveColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusStr = `Game Over! ${moveColor} is in checkmate.`;
            } else if (game.in_draw()) {
                statusStr = 'Game Over! Draw position.';
            } else {
                statusStr = `${moveColor} to move`;
                if (game.in_check()) {
                    statusStr += ' (In Check!)';
                }
            }

            $('#gameStatus').text(statusStr);
            renderMoveHistory();
        }

        function renderMoveHistory() {
            const history = game.history();
            let movesHTML = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNo = Math.floor(i / 2) + 1;
                const whiteMove = history[i] || '';
                const blackMove = history[i + 1] || '';
                movesHTML += `<b>${moveNo}.</b> ${whiteMove} ${blackMove} &nbsp;&nbsp; `;
            }
            $('#movesList').html(movesHTML || '1. ...');
            const movesDiv = document.getElementById('movesList');
            movesDiv.scrollTop = movesDiv.scrollHeight;
        }

        function resetGame() {
            game.reset();
            board.position('start');
            if (playerColor === 'b') {
                board.orientation('black');
                setTimeout(makeEngineMove, 500);
            } else {
                board.orientation('white');
            }
            updateStatus();
            $('#engineStatus').text('Stockfish Ready');
        }

        function undoMove() {
            if (isEngineThinking) return;
            // Undo engine move and player move
            game.undo();
            game.undo();
            board.position(game.fen());
            updateStatus();
        }

        function flipBoard() {
            board.flip();
        }

        function changeDifficulty() {
            engineDepth = parseInt($('#engineLevel').val());
        }

        function changeColor() {
            playerColor = $('#playerColor').val();
            resetGame();
        }
    </script>
</body>
</html>
