<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadagon - Play vs Stockfish Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

        header {
            width: 100%; background: #181818; padding: 12px 4%; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 2px solid #2a2a2a;
        }
        .brand-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .brand-logo { font-size: 1.6rem; color: #4CAF50; background: rgba(76, 175, 80, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(76, 175, 80, 0.3); }
        .brand-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; }

        .lobby-home-btn {
            background: #2a2a2a; color: #4CAF50; border: 1px solid #4CAF50; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.85rem;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px;
        }
        .lobby-home-btn:hover { background: #4CAF50; color: #000; }

        .main-container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; max-width: 1100px; margin: 0 auto; width: 100%; justify-content: center; align-items: flex-start; }

        .board-card { background: #1e1e1e; padding: 18px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .board-wrapper { width: 440px; height: 440px; position: relative; }
        #chessboard { width: 100%; height: 100%; }

        /* Highlight Selected Square */
        .highlight-square {
            box-shadow: inset 0 0 3px 3px #4CAF50 !important;
            background-color: rgba(76, 175, 80, 0.4) !important;
        }

        .board-controls { display: flex; gap: 8px; width: 100%; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: none; transition: 0.2s; background: #2a2a2a; color: #fff; border: 1px solid #3d3d3d; }
        .action-btn:hover { border-color: #4CAF50; background: #333; }
        .reset-btn { background: #333; color: #ccc; }

        .sidebar { flex: 1; min-width: 300px; max-width: 400px; background: #1e1e1e; padding: 20px; border-radius: 16px; border: 1px solid #333; display: flex; flex-direction: column; gap: 16px; }

        .config-box { background: #141414; padding: 14px; border-radius: 10px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 10px; }
        .config-title { font-size: 0.85rem; color: #aaa; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .opt-group { display: flex; gap: 10px; }
        .opt-btn { flex: 1; padding: 8px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; text-align: center; }
        .opt-btn.active { background: #4CAF50; color: #000; border-color: #4CAF50; }

        .status-box { background: #141414; padding: 12px; border-radius: 10px; border: 1px solid #2a2a2a; text-align: center; font-weight: bold; color: #4CAF50; }

        .moves-box { background: #141414; padding: 14px; border-radius: 10px; border: 1px solid #333; flex: 1; min-height: 160px; display: flex; flex-direction: column; }
        .moves-title { font-size: 0.85rem; font-weight: bold; color: #4CAF50; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .moves-list { font-family: 'Courier New', Courier, monospace; font-size: 0.88rem; color: #e0e0e0; line-height: 1.8; overflow-y: auto; max-height: 180px; word-break: break-word; }

        footer { margin-top: auto; padding: 15px; text-align: center; color: #666; font-size: 0.8rem; border-top: 1px solid #222; width: 100%; }
        footer a { color: #4CAF50; text-decoration: none; }

        @media (max-width: 500px) {
            .board-wrapper { width: 100%; height: 320px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-container" onclick="goToLobby()">
            <div class="brand-logo">◈</div>
            <div class="brand-title">Quadagon</div>
        </div>
        <button class="lobby-home-btn" onclick="goToLobby()">🏠 Main Menu</button>
    </header>

    <div class="main-container">
        <div class="board-card">
            <div class="board-wrapper">
                <div id="chessboard"></div>
            </div>
            <div class="board-controls">
                <button class="action-btn reset-btn" onclick="resetGame()">🔄 Reset</button>
                <button class="action-btn" onclick="undoMove()">↩️ Undo</button>
                <button class="action-btn" onclick="flipBoard()">🔄 Flip</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="config-box">
                <div class="config-title">Engine Level</div>
                <div class="opt-group">
                    <div class="opt-btn active" onclick="setDepth(5, this)">Beginner</div>
                    <div class="opt-btn" onclick="setDepth(10, this)">Club</div>
                    <div class="opt-btn" onclick="setDepth(15, this)">Master</div>
                </div>

                <div class="config-title" style="margin-top: 6px;">Play As</div>
                <div class="opt-group">
                    <div class="opt-btn active" onclick="setUserColor('w', this)">White</div>
                    <div class="opt-btn" onclick="setUserColor('b', this)">Black</div>
                </div>
            </div>

            <div class="status-box" id="gameStatus">Your Turn (White)</div>

            <div class="moves-box">
                <div class="moves-title">📜 Game Moves History</div>
                <div class="moves-list" id="movesList">1. ...</div>
            </div>
        </div>
    </div>

    <footer>
        <p><b>Quadagon Chess Suite</b> &copy; 2026. All Rights Reserved.</p>
        <p style="font-size: 0.75rem; margin-top: 4px; color: #555;">
            Powered by Open-Source Technologies: 
            <a href="https://github.com/jhlywa/chess.js" target="_blank">Chess.js</a> | 
            <a href="https://chessboardjs.com/" target="_blank">Chessboard.js</a> | 
            <a href="https://stockfishonline.com" target="_blank">Stockfish API</a>
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        let userColor = 'w';
        let engineDepth = 5;
        let selectedSquare = null;

        function goToLobby() { window.location.href = 'index.html'; }

        $(document).ready(function() {
            board = Chessboard('chessboard', {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });

            // Tap / Click Handler Override for Mobile & Desktop Touch
            $(document).on('click pointerdown', '#chessboard div[class*="square-"]', function(e) {
                e.stopPropagation();
                let square = null;
                const classes = $(this).attr('class').split(/\s+/);
                for (let c of classes) {
                    if (c.indexOf('square-') === 0 && c.length === 9) {
                        square = c.substring(7);
                        break;
                    }
                }

                if (square) {
                    onSquareTap(square);
                }
            });
        });

        function removeHighlights() {
            $('#chessboard div[class*="square-"]').removeClass('highlight-square');
        }

        function onSquareTap(square) {
            if (game.game_over() || game.turn() !== userColor) return;

            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === userColor) {
                    selectedSquare = square;
                    removeHighlights();
                    $(`#chessboard .square-${square}`).addClass('highlight-square');
                }
            } else {
                const source = selectedSquare;
                const target = square;

                if (source === target) {
                    selectedSquare = null;
                    removeHighlights();
                    return;
                }

                const move = game.move({ from: source, to: target, promotion: 'q' });

                if (move !== null) {
                    selectedSquare = null;
                    removeHighlights();
                    board.position(game.fen());
                    renderHistory();
                    checkGameState();
                    if (!game.game_over() && game.turn() !== userColor) {
                        makeEngineMove();
                    }
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === userColor) {
                        selectedSquare = square;
                        removeHighlights();
                        $(`#chessboard .square-${square}`).addClass('highlight-square');
                    } else {
                        selectedSquare = null;
                        removeHighlights();
                    }
                }
            }
        }

        function onDragStart(source, piece) {
            if (game.game_over() || (game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1) || game.turn() !== userColor) {
                return false;
            }
        }

        function onDrop(source, target) {
            selectedSquare = null;
            removeHighlights();
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            renderHistory();
            checkGameState();
            if (!game.game_over() && game.turn() !== userColor) {
                makeEngineMove();
            }
        }

        function onSnapEnd() { board.position(game.fen()); }

        function makeEngineMove() {
            $('#gameStatus').text('Stockfish is thinking... 🤔');
            const fen = encodeURIComponent(game.fen());
            const url = `https://stockfish.online/api/s/v2.php?fen=${fen}&depth=${engineDepth}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data && data.success && data.bestmove) {
                        const moveArr = data.bestmove.split(' ');
                        const bestMove = moveArr[1];
                        const from = bestMove.substring(0, 2);
                        const to = bestMove.substring(2, 4);
                        const promo = bestMove.length > 4 ? bestMove.substring(4, 5) : 'q';

                        game.move({ from: from, to: to, promotion: promo });
                        board.position(game.fen());
                        renderHistory();
                        checkGameState();
                    }
                })
                .catch(() => {
                    const moves = game.moves();
                    const randomMove = moves[Math.floor(Math.random() * moves.length)];
                    game.move(randomMove);
                    board.position(game.fen());
                    renderHistory();
                    checkGameState();
                });
        }

        function checkGameState() {
            if (game.in_checkmate()) {
                $('#gameStatus').text(game.turn() === userColor ? 'Checkmate! You Lost ❌' : 'Checkmate! You Won 🎉');
            } else if (game.in_draw()) {
                $('#gameStatus').text('Game Drawn 🤝');
            } else {
                $('#gameStatus').text(game.turn() === userColor ? 'Your Turn' : 'Engine Turn');
            }
        }

        function renderHistory() {
            const history = game.history();
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNo = Math.floor(i / 2) + 1;
                const wMove = history[i] || '';
                const bMove = history[i + 1] || '';
                html += `<b>${moveNo}.</b> ${wMove} ${bMove} &nbsp;&nbsp;`;
            }
            $('#movesList').html(html || '1. ...');
            const el = document.getElementById('movesList');
            el.scrollTop = el.scrollHeight;
        }

        function setDepth(depth, el) {
            engineDepth = depth;
            $('.opt-group .opt-btn').removeClass('active');
            $(el).addClass('active');
        }

        function setUserColor(color, el) {
            userColor = color;
            resetGame();
            if (userColor === 'b') {
                board.orientation('black');
                makeEngineMove();
            } else {
                board.orientation('white');
            }
        }

        function flipBoard() { board.flip(); }
        function undoMove() {
            selectedSquare = null;
            removeHighlights();
            game.undo(); game.undo();
            board.position(game.fen());
            renderHistory();
            checkGameState();
        }
        function resetGame() {
            selectedSquare = null;
            removeHighlights();
            game.reset();
            board.position('start');
            renderHistory();
            checkGameState();
        }
    </script>
</body>
</html>
