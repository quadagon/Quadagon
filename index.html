<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadagon - Open Source Chess Platform</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="Play chess seamlessly on Quadagon, a modern open-source chess platform built for speed and accessibility.">
    <meta name="keywords" content="chess, quadagon, open source chess, play chess online, chess.js">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="Quadagon - Open Source Chess Platform">
    <meta property="og:description" content="A modern, lightweight open-source chess platform.">
    <meta property="og:image" content="assets/logo.svg">

    <!-- Browser Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

    <!-- CSS / Responsive Design -->
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            color: #1a5276;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-img {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
        }
        #board {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        @media (max-width: 600px) {
            #board {
                max-width: 90vw;
            }
            .logo-img {
                width: 90px;
            }
        }
    </style>
</head>
<body>

    <header role="banner">
        <img src="assets/logo.svg" alt="Quadagon Logo" class="logo-img">
        <h1>Quadagon</h1>
        <p>Open Source Chess Platform</p>
    </header>

    <main role="main">
        <div id="board" role="region" aria-label="Interactive Chess Board"></div>
    </main>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Quadagon Error Handler:', msg);
            return false;
        };
    </script>
</body>
</html>
